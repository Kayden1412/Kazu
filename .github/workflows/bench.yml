name: Benchmark

# Manually triggered comparison of kazu against scc, tokei, and mezura on large
# repositories. By default every tool runs with its default ignore behaviour,
# so .gitignore files are honored and no --no-gitignore flag is passed. The
# no_gitignore and by_file inputs switch all four tools into the matching
# mode for the run.

on:
  workflow_dispatch:
    inputs:
      repos:
        description: >-
          Space-separated repositories. Short names (linux, zig, go, rust,
          ghostty) or explicit owner/name pairs.
        required: false
        default: linux zig go rust ghostty
        type: string
      ref:
        description: Branch, tag, or commit SHA to check out for every repository (empty = default branch)
        required: false
        default: ""
        type: string
      rounds:
        description: Timed rounds per tool per repository
        required: false
        default: 7
        type: number
      workers:
        description: kazu worker count (0 = CPU count)
        required: false
        default: 0
        type: number
      zig_version:
        description: Zig version used to build kazu
        required: false
        default: "0.17.1"
        type: string
      scc_ref:
        description: Branch, tag, or commit SHA to check out for scc (empty = default branch)
        required: false
        default: ""
        type: string
      mezura_ref:
        description: Branch, tag, or commit SHA to check out for mezura (empty = default branch)
        required: false
        default: ""
        type: string
      combined:
        description: >-
          Also scan every cloned repository as a single tree, in addition to
          the per-repository runs
        required: false
        default: true
        type: boolean
      by_file:
        description: >-
          Ask every tool for per-file output (kazu/scc/mezura --by-file, tokei
          --files); tokei's JSON always includes per-file reports
        required: false
        default: false
        type: boolean
      no_gitignore:
        description: >-
          Disable ignore files for every tool (kazu --no-gitignore
          --no-ignore; scc --no-gitignore --no-ignore --no-scc-ignore;
          tokei --no-ignore; mezura --no-gitignore --no-ignore-files)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

env:
  TOKEI_VERSION: "15.0.0"
  SCC_REPO: "https://github.com/boyter/scc"
  MEZURA_REPO: "https://github.com/subamanis/mezura"

jobs:
  bench:
    name: kazu vs scc vs tokei vs mezura
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out kazu
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ inputs.zig_version }}

      - name: Build kazu
        run: |
          set -euo pipefail
          zig version
          zig build -Doptimize=fast
          ./zig-out/bin/kazu --version

      - name: Fetch scc
        env:
          SCC_REF: ${{ inputs.scc_ref }}
        run: |
          set -euo pipefail
          if [ -n "$SCC_REF" ]; then
            if [[ "$SCC_REF" =~ ^[0-9a-f]{40}$ ]]; then
              git init -q "$RUNNER_TEMP/scc"
              git -C "$RUNNER_TEMP/scc" remote add origin "$SCC_REPO"
              git -C "$RUNNER_TEMP/scc" fetch -q --depth 1 origin "$SCC_REF"
              git -C "$RUNNER_TEMP/scc" checkout -q FETCH_HEAD
            else
              git clone -q --depth 1 --branch "$SCC_REF" "$SCC_REPO" "$RUNNER_TEMP/scc"
            fi
          else
            git clone -q --depth 1 "$SCC_REPO" "$RUNNER_TEMP/scc"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/scc/go.mod
          cache-dependency-path: ${{ runner.temp }}/scc/go.sum

      - name: Build scc
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/scc"
          go build -o "$RUNNER_TEMP/scc/scc" .
          "$RUNNER_TEMP/scc/scc" --version
          echo "$RUNNER_TEMP/scc" >> "$GITHUB_PATH"

      - name: Restore cached tokei
        id: tokei-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tokei
          key: tokei-${{ runner.os }}-${{ env.TOKEI_VERSION }}

      - name: Install tokei
        run: |
          set -euo pipefail
          if [ ! -x "$RUNNER_TEMP/tokei/bin/tokei" ]; then
            cargo install tokei --locked --version "$TOKEI_VERSION" --root "$RUNNER_TEMP/tokei"
          fi
          echo "$RUNNER_TEMP/tokei/bin" >> "$GITHUB_PATH"

      - name: Build mezura
        env:
          MEZURA_REF: ${{ inputs.mezura_ref }}
        run: |
          set -euo pipefail
          if [ -n "$MEZURA_REF" ]; then
            if [[ "$MEZURA_REF" =~ ^[0-9a-f]{40}$ ]]; then
              git init -q "$RUNNER_TEMP/mezura"
              git -C "$RUNNER_TEMP/mezura" remote add origin "$MEZURA_REPO"
              git -C "$RUNNER_TEMP/mezura" fetch -q --depth 1 origin "$MEZURA_REF"
              git -C "$RUNNER_TEMP/mezura" checkout -q FETCH_HEAD
            else
              git clone -q --depth 1 --branch "$MEZURA_REF" "$MEZURA_REPO" "$RUNNER_TEMP/mezura"
            fi
          else
            git clone -q --depth 1 "$MEZURA_REPO" "$RUNNER_TEMP/mezura"
          fi
          cargo build --release --bin mezura --manifest-path "$RUNNER_TEMP/mezura/Cargo.toml"
          "$RUNNER_TEMP/mezura/target/release/mezura" --version

      - name: Verify tools
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/zig-out/bin/kazu" --version
          scc --version
          tokei --version
          "$RUNNER_TEMP/mezura/target/release/mezura" --version

      - name: Clone repositories
        env:
          REPOS: ${{ inputs.repos }}
          REF: ${{ inputs.ref }}
          COMBINED: ${{ inputs.combined }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/repos"
          : > "$RUNNER_TEMP/repo-args.txt"

          declare -A aliases=(
            [linux]=torvalds/linux
            [zig]=ziglang/zig
            [ziglang]=ziglang/zig
            [go]=golang/go
            [rust]=rust-lang/rust
            [ghostty]=ghostty-org/ghostty
            [scc]=boyter/scc
            [tokei]=XAMPPRocky/tokei
          )

          read -ra requested <<< "${REPOS//,/ }"
          if [ "${#requested[@]}" -eq 0 ]; then
            echo "::error::no repositories requested"
            exit 1
          fi

          for item in "${requested[@]}"; do
            slug="${aliases[$item]:-$item}"
            if [[ "$slug" != */* ]]; then
              echo "::error::cannot resolve '$item'; use a short name or owner/name"
              exit 1
            fi

            dir="$RUNNER_TEMP/repos/${slug//\//__}"
            if [ ! -d "$dir/.git" ]; then
              echo "::group::Cloning $slug"
              if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
                git init -q "$dir"
                git -C "$dir" remote add origin "https://github.com/$slug.git"
                git -C "$dir" fetch -q --depth 1 origin "$REF"
                git -C "$dir" checkout -q FETCH_HEAD
              elif [ -n "$REF" ]; then
                git clone -q --depth 1 --branch "$REF" "https://github.com/$slug.git" "$dir"
              else
                git clone -q --depth 1 "https://github.com/$slug.git" "$dir"
              fi
              echo "::endgroup::"
            fi

            echo "$slug=$dir" >> "$RUNNER_TEMP/repo-args.txt"
            du -sh "$dir"
          done

          # The clone parent contains every checkout and nothing else, so it is
          # also a valid scan root. Scanning it measures all four tools on one
          # large tree, which is the closest match to a real monorepo workload.
          if [ "$COMBINED" = "true" ] && [ "$(wc -l < "$RUNNER_TEMP/repo-args.txt")" -ge 2 ]; then
            echo "all-repos=$RUNNER_TEMP/repos" >> "$RUNNER_TEMP/repo-args.txt"
          fi

      - name: Run benchmark
        env:
          BY_FILE: ${{ inputs.by_file }}
          NO_GITIGNORE: ${{ inputs.no_gitignore }}
        run: |
          set -euo pipefail

          mapfile -t repo_entries < "$RUNNER_TEMP/repo-args.txt"
          args=()
          for entry in "${repo_entries[@]}"; do
            args+=(--repo "$entry")
          done

          modes=()
          if [ "$BY_FILE" = "true" ]; then
            modes+=(--by-file)
          fi
          if [ "$NO_GITIGNORE" = "true" ]; then
            modes+=(--no-gitignore)
          fi

          python3 .github/scripts/bench.py \
            --kazu "$GITHUB_WORKSPACE/zig-out/bin/kazu" \
            --scc "$(command -v scc)" \
            --tokei "$(command -v tokei)" \
            --mezura "$RUNNER_TEMP/mezura/target/release/mezura" \
            --rounds "${{ inputs.rounds }}" \
            --workers "${{ inputs.workers }}" \
            "${modes[@]}" \
            "${args[@]}" \
            --json bench-results.json \
            --markdown bench-results.md \
            --svg bench-memory.svg

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Environment"
            echo
            echo "- Runner: \`$(uname -srm)\`"
            echo "- CPUs: $(nproc)"
            echo "- Zig: \`$(zig version 2>/dev/null || echo unknown)\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f bench-results.md ]; then
            cat bench-results.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Benchmark did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            bench-results.json
            bench-results.md
            bench-memory.svg
          if-no-files-found: warn
